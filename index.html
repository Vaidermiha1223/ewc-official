*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#111612;color:#e9e3d5;font:16px/1.65 system-ui,sans-serif}a{color:inherit;text-decoration:none}nav{position:sticky;top:0;z-index:5;background:#111612f5;border-bottom:1px solid #bba16b44;display:flex;align-items:center;gap:24px;padding:16px 6%;flex-wrap:wrap}nav strong{font: bold 28px Georgia;color:#d4b77b;letter-spacing:5px;margin-right:auto}button,.btn{background:#c9ad74;color:#141913;border:0;padding:12px 22px;cursor:pointer;font-weight:700;display:inline-block}header{min-height:85vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#52604b66,transparent 65%),repeating-linear-gradient(45deg,transparent 0 65px,#c9ad7409 66px 67px),#151d17}header:before{content:'';position:absolute;inset:5%;border:1px solid #c9ad7433;pointer-events:none}header div{padding:55px 25px;position:relative}small{color:#c9ad74;letter-spacing:3px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.1}h1{font-size:clamp(50px,10vw,130px);margin:25px 0}h1 em{color:#d4b77b;font-style:normal}h2{font-size:clamp(34px,5vw,64px);margin:15px 0 30px}h3{font-size:26px;margin:10px 0}p{color:#b7bcb0}header p{max-width:650px;margin:20px auto 35px;font-size:19px}section{max-width:1250px;margin:auto;padding:85px 6%;scroll-margin-top:80px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{padding:26px;background:#1c241e;border:1px solid #c9ad742b;transition:.3s}.card:hover{transform:translateY(-5px);border-color:#c9ad74}.num{color:#c9ad74;font:30px Georgia}.fall{background:radial-gradient(ellipse at top,#50352c55,transparent 80%);border-block:1px solid #c9ad7433}.timeline{border-left:1px solid #c9ad74;padding-left:25px}details{padding:16px 0;border-bottom:1px solid #c9ad7422}summary{cursor:pointer;color:#e9e3d5;font:23px Georgia}footer{text-align:center;border-top:1px solid #c9ad7433;padding:45px}.reveal{animation:appear .8s both}@keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:650px){nav{gap:12px;font-size:13px}section{padding-block:55px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style><body><nav><strong>EWC</strong><a href="#world" data-t="Мир|World"></a><a href="#economy" data-t="Экономика|Economy"></a><a href="#fall" data-t="После падения|After the Fall"></a><a href="#roadmap" data-t="План разработки|Roadmap"></a><button id="lang">EN</button><a href="#wiki" data-t="Энциклопедия|Wiki"></a><a href="#fullroad" data-t="Этапы разработки|20 stages"></a></nav><header><div><small data-t="Проект Roblox · В разработке|Roblox experience · In development"></small><h1><span data-t="Империя.|Empire."></span><br><span data-t="Война.|War."></span><br><em data-t="Капитализм.|Capitalism."></em></h1><p data-t="Создавай государства. Развивай экономику. Строй города. Определяй судьбу своей страны.|Build nations. Develop economies. Raise cities. Shape your country's destiny."></p><a class="btn" href="#world" data-t="Открыть мир EWC|Discover EWC"></a></div></header><main id="main"></main><script>
const sections=[['world','01 / МИР|01 / WORLD','Мир четырёх государств|A world of four nations',[['04','Государства|Nations','Четыре деревни, отдельные казны и территории.|Four villages, separate treasuries and territories.'],['3 × 3','Главный остров|Main island','Горы, леса, реки, озёра и болота. Размер предварительный.|Mountains, forests, rivers, lakes and swamps. Scale is provisional.'],['05','Режимы|World modes','12 часов, 24 часа, 3 дня, месяц и мир друзей.|12 hours, 24 hours, 3 days, one month and private worlds.']]],['economy','02 / КАПИТАЛИЗМ|02 / CAPITALISM','Экономика и общество|Economy and society',[['01','Добыча|Gathering','Добывай и перевозь ресурсы.|Gather and transport resources.'],['02','Производство|Production','Развивай мастерские и фермы.|Develop workshops and farms.'],['03','Предприятия|Enterprise','Владей бизнесом, нанимай работников и продавай товары.|Own businesses, hire workers and sell goods.'],['04','Торговля|Trade','Развивай рынок, государственные заказы и поставки.|Develop markets, public contracts and deliveries.']]],['politics','03 / ВЛАСТЬ|03 / POWER','Власть и политика|Power and politics',[['I','Монархия|Monarchy','Выборы правителя и государственные полномочия.|Elections and government authority.'],['II','Классы|Classes','Профессия, имущество и должность — разные системы.|Profession, wealth and office are separate systems.'],['III','Дипломатия|Diplomacy','Торговые соглашения, союзы и соперничество.|Trade agreements, alliances and rivalry.']]],['fall','04 / БУДУЩЕЕ ОБНОВЛЕНИЕ|04 / FUTURE UPDATE','После падения|After the Fall',[['I','Изгнание|Exile','Переезд в другое государство с потерей домашнего имущества.|Move to another nation, leaving household property behind.'],['II','Отказаться платить|Refuse to pay','Остаться в городе с риском заключения.|Remain in the city at risk of imprisonment.'],['III','Принять новую власть|Accept new rule','Присяга и повышенные налоги в обмен на сохранение класса.|Pledge allegiance and pay higher taxes to retain your class.'],['IV','Жизнь без флага|Life without a flag','Отдалённое лесное поселение, выборы лидера, строительство и игровые задания по эвакуации граждан.|A remote forest settlement, leader elections, construction and civilian evacuation quests.']]],['sea','05 / ЭКСПЕДИЦИИ|05 / EXPLORATION','За горизонтом|Beyond the horizon',[['01','Флот|Fleet','Лодки, верфи и парусные суда.|Boats, shipyards and sailing ships.'],['02','Экспедиции|Expeditions','Исследование островов и новые поселения.|Island exploration and new settlements.'],['03','Морская торговля|Maritime trade','Порты, грузы и заморская экономика.|Ports, cargo and overseas economies.']]],['music','07 / САУНДТРЕК|07 / SOUNDTRACK','Музыка эпохи|The sound of an era',[]]];
const roadmap=[['Основы|Foundations','Добыча, интерфейс, строительство|Gathering, interface, construction'],['Рассвет промышленности|Industrial Dawn','Производство, фермы, сохранения|Production, farming, persistence'],['Возвышение государств|Rise of Nations','Государства, бизнес, торговля|Nations, business, trade'],['Эпоха конфликтов|Age of Conflict','Бои, дипломатия, закрытая альфа|Combat, diplomacy, closed alpha'],['Новый мир|The New World','Полная карта и управление|Full map and government'],['После падения|After the Fall','Оккупация и судьба граждан|Occupation and citizens'],['За горизонтом|Beyond the Horizon','Транспорт, флот, колонии|Transport, fleets, colonies'],['Живой мир|Living World','Неигровые персонажи и режимы|NPCs and modes'],['Новая эпоха|A New Era','Бета и публичный запуск|Beta and public release']];
const musicTracks=[["Марш Радецкого", "Radetzky March", "audio/01.mp3"], ["Haus in neu Berlin - пианино", "Haus in neu Berlin - Piano", "audio/02.m4a"], ["Британские гренадеры - марш", "The British Grenadiers - March", "audio/08.mp3"], ["Священная война - марш", "The Sacred War - March", "audio/09.m4a"], ["Когда мы были на войне - минус", "When We Were at War - Instrumental", "audio/07.mp3"], ["Haus in neu Berlin - симфонический оркестр", "Haus in neu Berlin - Symphony Orchestra", "audio/05.mp3"], ["Haus in neu Berlin - Оркестр remix", "Haus in neu Berlin - Orchestra remix", "audio/06.mp3"], ["Haus in neu Berlin - TNO", "Haus in neu Berlin - TNO", "audio/03.mp3"], ["Haus in neu Berlin - Remix", "Haus in neu Berlin - Remix", "audio/04.mp3"]];const musicSituations=[["Экономическое процветание, стабильность и развитие государства.", "Economic prosperity, stability and national development."], ["Мирное время, повседневная жизнь, строительство и работа.", "Peacetime, everyday life, construction and work."], ["Победа государства в войне.", "A nation’s victory in war."], ["Начало оборонительной войны.", "The beginning of a defensive war."], ["Голод, бедность и нехватка продовольствия.", "Famine, poverty and food shortages."], ["Военное положение и продолжительный конфликт.", "Wartime conditions and prolonged conflict."], ["Государство теряет территории, его положение ухудшается, но столица ещё не осталась единственной территорией.", "The nation is losing territory and its situation is deteriorating, but the capital is not yet its only remaining territory."], ["Критическое положение: государство потеряло все территории, кроме столицы, которая продолжает держать оборону. При возвращении части территорий композиция сменяется.", "Critical situation: the nation has lost every territory except its capital, which continues to hold out. The track changes when territory is regained."], ["Падение столицы, капитуляция и потеря независимости. Кат-сцена и выбор дальнейшей судьбы.", "Fall of the capital, capitulation and loss of independence. The cutscene and choice of what comes next."]];let activeTrack=-1;const localTracks=new Map(musicTracks.map((r,i)=>[i,r[2]]));function musicPanel(){return `<div class="ost-list">${musicTracks.map((r,i)=>`<article class="ost-row"><span class="ost-no">${String(i+1).padStart(2,'0')}</span><div class="ost-info"><h3>${r[lang]}</h3><p class="ost-situation">${t("В игре:|In game:")} ${musicSituations[i][lang]}</p></div><div class="ost-actions"><button type="button" data-track="${i}" onclick="playTrack(${i})">${t('▶ Слушать|▶ Play')}</button></div></article>`).join('')}</div><div class="ost-player"><p id="ostNow" aria-live="polite">${activeTrack<0?'':musicTracks[activeTrack][lang]}</p><audio id="ostAudio" preload="none"></audio></div>`}function syncMusic(){const a=document.querySelector('#ostAudio');document.querySelectorAll('[data-track]').forEach(b=>{const on=Number(b.dataset.track)===activeTrack&&a&&!a.paused;b.textContent=on?t('Ⅱ Пауза|Ⅱ Pause'):t('▶ Слушать|▶ Play');b.setAttribute('aria-pressed',String(on))})}function playTrack(i){const a=document.querySelector('#ostAudio');if(activeTrack===i&&!a.paused){a.pause();return}if(activeTrack!==i||!a.getAttribute('src')){activeTrack=i;a.src=musicTracks[i][2]}document.querySelector('#ostNow').textContent=musicTracks[i][lang];a.play().catch(()=>{document.querySelector('#ostNow').textContent=t('Не удалось воспроизвести файл. Распакуй весь архив.|Unable to play. Extract the entire archive.')});}document.addEventListener('play',syncMusic,true);document.addEventListener('pause',syncMusic,true);document.addEventListener('ended',syncMusic,true);
let lang=0;try{lang=localStorage.ewcLang==='1'?1:0}catch{};const t=s=>s.split('|')[lang]||s;function render(){document.documentElement.lang=lang?'en':'ru';document.title=lang?'EWC — Empire, War, Capitalism':'EWC — Империя, война, капитализм';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelector('#lang').textContent=lang?'RU':'EN';let html='';for(const [id,label,title,cards] of sections){if(id==='music')html+=`<section id="roadmap"><small>${t('06 / РАЗРАБОТКА|06 / DEVELOPMENT')}</small><h2>${t('Дорожная карта|Roadmap')}</h2><p>${t('Предварительные названия и порядок обновлений.|Provisional update names and sequence.')}</p><div class="timeline">${roadmap.map((r,i)=>`<details><summary>${i+1}. ${t(r[0])}</summary><p>${t(r[1])}</p></details>`).join('')}</div></section>`;html+=`<div class="${id==='fall'?'fall':''}"><section id="${id}"><small>${t(label)}</small><h2>${t(title)}</h2><div class="grid">${(id==='music'?[]:cards).map(c=>`<article class="card"><div class="num">${c[0]}</div><h3>${t(c[1])}</h3><p>${t(c[2])}</p></article>`).join('')}</div>${id==='music'?musicPanel():''}</section></div>`}const previous=document.querySelector('#ostAudio');const position=previous?.currentTime||0;const playing=previous&&!previous.paused;previous?.pause();document.querySelector('#main').innerHTML=html;if(activeTrack>=0&&localTracks.has(activeTrack)){const audio=document.querySelector('#ostAudio');audio.src=localTracks.get(activeTrack);audio.addEventListener('loadedmetadata',()=>{audio.currentTime=position;if(playing)audio.play().catch(()=>{})},{once:true})}if('IntersectionObserver'in window){const ob=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');ob.unobserve(e.target)}}));document.querySelectorAll('section').forEach(e=>ob.observe(e))}}document.querySelector('#lang').onclick=()=>{lang=1-lang;try{localStorage.ewcLang=lang}catch{}render()};render();</script><style>#wiki,#fullroad{scroll-margin-top:100px}#wikiSearch{width:100%;padding:16px;background:#1c241e;color:#eee;border:1px solid #a68c58;font:inherit;margin:15px 0}#wikiList details{border-bottom:1px solid #bba16b33;padding:18px 0}#wikiList summary{cursor:pointer;font:22px Georgia;color:#d8bc80}#wikiList p{max-width:850px}#fullRoadList{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}#fullRoadList{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))!important}#fullRoadList article p{font-size:15px;line-height:1.65}#fullRoadList article{padding:18px;border:1px solid #bba16b44;background:#19221b}#fullRoadList b{color:#c9ad74}</style><section id="wiki"><h2 data-t="Энциклопедия — 28 разделов|Encyclopedia — 28 chapters"></h2><p data-t="Полный обзор концепции. Механики запланированы, если не указано иное.|Complete concept overview. Features are planned unless stated otherwise."></p><input id="wikiSearch" type="search"><div id="wikiList"></div></section><section id="fullroad"><h2 data-t="Все 20 этапов разработки|All 20 development stages"></h2><p data-t="Порядок из ROADMAP от 15 ноября. Статусы не подтверждены.|Sequence from the November 15 roadmap. Completion status is unverified."></p><div id="fullRoadList"></div></section><script>const wikiData=[["Идея игры", "Game concept", "Четыре государства развиваются от деревень до городов. Игроки создают экономику, управляют обществом и определяют историю кампании.\n\nКаждая кампания начинается с небольших деревень. Добытчики снабжают мастерские, фермеры обеспечивают население продовольствием, предприниматели организуют производство, а руководство распределяет бюджет. Игрок может менять занятие и развиваться через собственный труд или предприятие.", "Four nations grow from villages into cities. Players build economies, govern society and shape each campaign.\n\nEach campaign begins with small villages. Gatherers supply workshops, farmers provide food, entrepreneurs organize production and leaders allocate budgets. Players can change occupations and advance through labor or enterprise."], ["Мир и биомы", "World and biomes", "Главный остров около 3 × 3 км: реки, два озера, горы, болота, леса, дюны и снежные вершины. Малые острова предназначены для экспедиций.\n\nГеография определяет стоимость перевозок и доступ к сырью. Дороги, мосты и порты связывают поселения; альтернативные маршруты не позволяют одному мосту остановить всю экономику. Масштаб проверяется по времени путешествий.", "A main island of roughly 3 × 3 km features rivers, two lakes, mountains, marshes, forests, dunes and snowy peaks. Smaller islands support expeditions.\n\nGeography shapes transport costs and resource access. Roads, bridges and ports connect settlements; alternative routes prevent a single bridge from blocking the economy. Scale is evaluated through travel times."], ["Фракции", "Factions", "Четыре прибрежных старта: ратуша, склад, поля, животные и базовые ресурсы. Цвета: синий, красный, жёлтый, зелёный.\n\nКаждый старт предусматривает ратушу, каменный склад, деревянные постройки, поля пшеницы, хлопка и льна, загоны и доступ к воде. У каждой стороны отдельные гражданство, бюджет и управление. Названия и уникальные бонусы ещё не утверждены.", "Four coastal starts feature a town hall, warehouse, fields, livestock and basic resources. Colors: blue, red, yellow and green.\n\nEach start includes a town hall, stone warehouse, wooden buildings, wheat, cotton and flax fields, pens and water access. Each side has separate citizenship, budget and government. Names and unique bonuses remain undecided."], ["Режимы серверов", "Server modes", "Кампании на 12 часов, 24 часа, 3 дня и месяц; отдельный сохраняемый мир друзей на 1–5 игроков.\n\nИмущество относится к конкретной кампании и не переносится между мирами. Вайп завершает кампанию, но обычный технический перезапуск не должен стирать сохранения. Темп строительства и производства зависит от режима.", "Campaigns last 12 hours, 24 hours, three days or a month; a separate persistent friends mode supports 1–5 players.\n\nProperty belongs to its campaign and cannot transfer between worlds. A wipe ends a campaign, but a technical restart should not erase saves. Construction and production pace depends on the mode."], ["Баланс и неигровые персонажи", "Balance and NPCs", "Ограничение переполненных фракций; Неигровые персонажи помогают с работой и населением. Предварительный ориентир — два неигровых персонажа на недостающего игрока.\n\nNPC смогут выполнять отдельные работы, переносить грузы и поддерживать население при низком онлайне. Предел численности и правила расчёта дисбаланса предстоит определить. Автономные государства NPC относятся к поздней разработке.", "Overcrowded factions are restricted; NPCs support labor and population. Two NPCs per missing player is a tentative target.\n\nNPCs may perform jobs, carry goods and support population during low activity. Population caps and imbalance calculations remain undecided. Autonomous NPC nations are a later development goal."], ["Ресурсы", "Resources", "Дерево, доски, камень, гравий, песок, глина, уголь, торф, металлы, зерно, хлопок, лён, кожа, вода и другие материалы. Сталь и бронза производятся.\n\nСырьё становится основой цепочек производства: древесина превращается в доски, зерно — в муку и пищу, волокно — в ткань, глина — в кирпич. Доступность материалов влияет на цены и выбор профессий.", "Wood, planks, stone, gravel, sand, clay, coal, peat, metals, grain, cotton, flax, leather, water and other materials. Steel and bronze are manufactured.\n\nRaw materials feed production chains: wood becomes planks, grain becomes flour and food, fiber becomes cloth, and clay becomes bricks. Availability affects prices and occupational choices."], ["Шахты и добыча", "Mining", "Разведка месторождений, развитие шахт, склады и дороги. Рабочий ориентир — 16 основных точек, включая восемь внутренних.\n\nПоверхностные залежи обеспечивают начальное развитие, а внутренние районы предлагают более богатые ресурсы. Разведка раскрывает состав месторождения; развитие шахты требует материалов, склада и дороги. Добытый груз нужно доставить потребителю.", "Prospecting, mine development, warehouses and roads. A tentative layout includes 16 major sites, eight inland.\n\nSurface deposits support early development while inland regions offer richer resources. Prospecting reveals deposit contents; mine development requires materials, storage and roads. Extracted cargo must reach its consumer."], ["Фермерство", "Farming", "Посев, урожай, переработка зерна, хлопка и льна, животноводство, рыбалка и охота. Сроки роста уточняются.\n\nФермер получает посадочный материал, выращивает культуры и продаёт урожай либо передаёт его на переработку. Животноводство требует кормов и даёт продукты и материалы. Рыбалка, охота и травы расширят гражданские занятия.", "Planting, harvesting, grain and fiber processing, livestock, fishing and hunting. Growth times remain undecided.\n\nFarmers obtain seeds, grow crops and sell harvests or send them for processing. Livestock requires feed and supplies food and materials. Fishing, hunting and herbs will broaden civilian occupations."], ["Инвентарь и перевозка", "Inventory and logistics", "Мешок на 30 кг, ручная телега на 70 кг; позже повозки, лодки, баржи и суда.\n\nВес ограничивает объём одной поставки. Телега позволяет перевозить больше, но требует погрузки и разгрузки. Дороги и водный транспорт должны сделать дальние поставки выгоднее; права на груз и транспорт учитываются отдельно.", "A 30 kg bag and 70 kg handcart; later, wagons, boats, barges and ships.\n\nWeight limits each delivery. A cart carries more but requires loading and unloading. Roads and water transport should improve long-distance deliveries; cargo and vehicle ownership are tracked separately."], ["Крестьянство", "Civilian labor", "Добыча, работа на фермах, оплаченные поставки, частные заказы и собственное жильё.\n\nНачинающий гражданин получает простые инструменты и мешок. Он может выполнять государственные поставки, работать на полях, продавать материалы или принимать частные заказы. Заработок позволяет приобрести жильё и развивать своё дело.", "Gathering, farm work, paid deliveries, private contracts and personal housing.\n\nA new citizen receives basic tools and a bag. They can fulfill public deliveries, work fields, sell materials or accept private contracts. Earnings allow them to buy housing and develop a business."], ["Кузнецы и производство", "Crafting and manufacturing", "Мастерские перерабатывают сырьё. Собственность на результат зависит от владельца материалов; работа оплачивается отдельно.\n\nВ мастерской важны принадлежность сырья и условия заказа. Изделие из материалов заказчика принадлежит заказчику, а работник получает оплату. Частные предприятия могут нанимать кузнецов и выплачивать согласованную долю от продаж.", "Workshops process materials. Output ownership follows material ownership; labor is paid separately.\n\nWorkshops track material ownership and contract terms. Goods made from customer materials belong to the customer, while workers receive payment. Private businesses can hire smiths and pay an agreed share of sales."], ["Торговля и дипломатия", "Trade and diplomacy", "Торговые дома, соглашения, перевозки, пошлины и комиссии. Дипломатические состояния: мир, торговля, союз и война.\n\nТорговец связывает рынки государств: получает разрешённый груз, доставляет его и получает комиссию. Избыток товара в одной стране может покрывать дефицит другой. Договоры и пошлины влияют на доступность и прибыльность торговли.", "Trading houses, agreements, deliveries, duties and commissions. Diplomatic states include peace, trade, alliance and war.\n\nMerchants connect national markets by receiving authorized cargo, delivering it and earning a commission. Surplus in one country may cover shortages in another. Agreements and duties affect access and profitability."], ["Экономика и классы", "Economy and classes", "Частная собственность, государственная казна, спрос и цены, налоги, наём. Средний класс владеет бизнесом, высший — крупными предприятиями. Профессия, класс и должность разделены.\n\nКазна финансирует общественные заказы из поступлений. При дефиците закупочные выплаты могут расти, при избытке — снижаться. Средний класс развивает магазины и мастерские, высший организует крупные предприятия и финансирует проекты. Договоры отделяют деньги работника, собственника и государства.", "Private property, treasury, demand and prices, taxes and employment. The middle class owns businesses; the upper class owns major enterprises. Profession, class and office are separate.\n\nThe treasury funds public contracts from revenue. Procurement payments may rise during shortages and fall during surpluses. Middle-class players develop shops and workshops; upper-class players organize major enterprises and fund projects. Contracts separate worker, owner and state funds."], ["Строительство", "Construction", "Чертежи, доставка материалов, этапы строительства. Дома, ратуши, склады, фермы, мастерские, дороги, мосты и порты.\n\nИгрок выбирает разрешённое место, размещает чертёж и доставляет материалы по этапам. Дома дают личное пространство и хранение, мастерские расширяют производство, склады и дороги улучшают снабжение. Права доступа зависят от владельца.", "Blueprints, material deliveries and construction stages. Homes, town halls, warehouses, farms, workshops, roads, bridges and ports.\n\nPlayers choose an authorized site, place a blueprint and deliver materials in stages. Houses provide personal space and storage, workshops expand production, and warehouses and roads improve supply. Access depends on ownership."], ["Флот и колонии", "Fleet and colonies", "Малые лодки, верфи, парусные суда, экспедиции, островные поселения и заморская торговля. Владение колониями и доходы ещё обсуждаются.\n\nВерфи связывают производство древесины, ткани и комплектующих с морским транспортом. Экспедиции открывают островные ресурсы и торговлю с местными NPC. Колониям нужны склады, пристани и регулярное снабжение; заморские ресурсы не обязательны для начального развития.", "Small boats, shipyards, sailing ships, expeditions, island settlements and overseas trade. Colonial ownership and revenue rules remain open.\n\nShipyards connect timber, cloth and component production with maritime transport. Expeditions open island resources and trade with local NPCs. Colonies need warehouses, docks and regular supplies; overseas resources are not required for early development."], ["Армия и звания", "Army and ranks", "Рядовой, сержант, полковник и генерал. Система игровых званий, командования и снабжения требует балансировки.\n\nВоенная роль отличается от профессии и имущественного класса. Звания определяют игровые обязанности и полномочия. Снабжение зависит от работы гражданской экономики; правила повышения и оплаты ещё уточняются.", "Private, sergeant, colonel and general. In-game ranks, command and supply require balancing.\n\nMilitary roles are separate from occupations and wealth classes. Ranks determine in-game duties and permissions. Supply depends on the civilian economy; promotion and payment rules remain open."], ["Бои и территории", "Combat and territories", "Игровые сражения и смена контроля над территориями, поселениями и столицами. Условия победы ещё не утверждены.\n\nТерриториальная система связывает ресурсные точки, поселения и столицы с государственным владением. Изменение контроля должно корректно обновлять права на объекты. Условия победы и окончания кампании ещё предстоит закрепить.", "In-game battles and changes in control of territories, settlements and capitals. Victory conditions remain undecided.\n\nThe territory system connects resource sites, settlements and capitals with state ownership. Changes of control must correctly update object permissions. Victory and campaign-ending conditions remain undecided."], ["Монарх и управление", "Monarchy and government", "Выдвижение кандидатов, голосования, назначения, управление казной. Полномочия и преемственность требуют уточнения.\n\nМонарх распоряжается государственными полномочиями и назначениями в установленных пределах. Выборы должны учитывать право голоса, большинство и неактивность руководителя. Налоговые ограничения и влияние крупных собственников пока обсуждаются.", "Candidates, voting, appointments and treasury management. Powers and succession rules remain open.\n\nThe monarch exercises public authority and appointments within defined limits. Elections must account for eligibility, majority rules and inactive leaders. Tax limits and the influence of major owners remain under discussion."], ["Смерть, выход и смена стороны", "Respawn and faction changes", "Переносимый груз и домашнее имущество учитываются отдельно. Правила потерь, отключений и смены стороны требуют проверки.\n\nПереносимые вещи и имущество в доме учитываются отдельно. Возрождение возвращает игрока в столицу. Правила обычного выхода, отключения и перехода в другую страну ещё требуют согласования, чтобы технический сбой не приводил к несправедливым потерям.", "Carried cargo and household property are tracked separately. Loss, disconnect and faction-switch rules require testing.\n\nCarried items and property stored at home are tracked separately. Respawning returns the player to the capital. Ordinary logout, disconnection and faction-change rules need agreement to prevent unfair losses from technical failures."], ["Поражение и оккупация", "Defeat and occupation", "После падения: изгнание, отказ платить, принятие новой власти или жизнь без флага. Новая концепция заменяет прежний разовый сбор; точные налоги ещё не определены.\n\nПосле падения государства игрок выбирает изгнание, отказ от выплат, принятие новой власти или жизнь без флага. Принятие власти предполагает повышенные налоги и сохранение класса; изгнание означает потерю домашнего имущества. Точные размеры платежей не закреплены.", "After the Fall: exile, refusal to pay, acceptance of new authority or life without a flag. The new concept replaces the earlier one-time levy; exact taxes remain open.\n\nAfter a nation falls, players choose exile, refusal to pay, acceptance of new rule or life without a flag. Accepting rule means higher taxes and retaining class; exile means losing household property. Exact payment amounts remain undecided."], ["Жизнь без флага", "Life without a flag", "Отдалённое лесное поселение, скрытое на политической карте. Выбор местного лидера, строительство и игровые задания по эвакуации граждан.\n\nВыбравшие этот путь начинают новую жизнь в отдалённом лесном поселении, которое не отображается на картах других государств. Они выбирают лидера, развивают лагерь и выполняют игровые задания по эвакуации граждан. Это отдельная ветвь продолжения кампании.", "A remote forest settlement hidden on the political map. Elect a local leader, build a community and complete civilian evacuation quests.\n\nPlayers choosing this path begin anew in a remote forest settlement absent from other nations' maps. They elect a leader, develop their camp and complete civilian evacuation quests. This is a separate branch of the ongoing campaign."], ["Шпионаж", "Espionage", "Запланирована игровая роль шпиона с особым статусом и ограниченными полномочиями. Правила раскрытия ещё обсуждаются.\n\nШпионаж задуман как игровая роль с отдельным статусом и ограничениями доступа. Раскрытие маскировки меняет доступные функции персонажа. Баланс этой системы требует совместных тестов.", "A planned spy role has a special in-game status and limited permissions. Discovery rules remain under discussion.\n\nEspionage is planned as an in-game role with a distinct status and access restrictions. Revealing a disguise changes available character functions. Balancing this system requires multiplayer tests."], ["Гвардия и тюрьмы", "Guards and prisons", "Игровая служба безопасности, проверки статусов и система заключения. Баланс и длительность требуют тестирования.\n\nГвардия отвечает за игровые проверки и порядок в столице. Заключение представляет собой временный статус персонажа. Правила проверок, длительность ограничений и восстановление доступа необходимо согласовать до реализации.", "An in-game security service, status checks and imprisonment system. Balance and duration require testing.\n\nGuards handle in-game checks and order in the capital. Imprisonment is a temporary character status. Check rules, restriction durations and restored access need agreement before implementation."], ["Общение и интерфейс", "Communication and UI", "Локальный чат с фильтрацией Roblox, карта, инвентарь, заказы, строительство, торговля, голосования и обучение.\n\nИнтерфейс объединяет инвентарь, карту, строительство, производство, цены, заказы, договоры и управление предприятиями. Руководителям доступны бюджет и полномочия. Новичкам нужно короткое обучение, а участникам кампании — уведомления о её завершении.", "Roblox-filtered local chat, map, inventory, contracts, construction, trade, voting and tutorials.\n\nThe interface combines inventory, maps, construction, production, prices, orders, contracts and business management. Leaders have budget and authority controls. Newcomers need a short tutorial and campaign participants need end-of-campaign notifications."], ["Техническая основа", "Technical foundation", "Серверная проверка операций, сохранения мира и собственности, журнал действий, оптимизация и поддержка телефона.\n\nСервер проверяет владение, количество, вес, покупки, передачу и выплаты. Сохранения охватывают не только счета, но и дома, контейнеры, предприятия, договоры и обязательства. Повторный запрос не должен повторно выдавать товар или деньги.", "Server-side validation, world and property persistence, activity logs, optimization and mobile support.\n\nThe server validates ownership, quantity, weight, purchases, transfers and payments. Saves cover not only accounts but also homes, containers, businesses, contracts and obligations. Repeated requests must not issue goods or money twice."], ["Предложения", "Proposals", "Обсуждаются аренда мастерских, жалованье, временный регент, защита от потерь при отключении и другие улучшения. Они не утверждены автоматически.\n\nСреди обсуждаемых улучшений — аренда мастерской, резервирование зарплаты, сохранение профессионального опыта, временное хранилище при переходе и совет крупных собственников. Это предложения, а не утверждённые возможности.", "Workshop rental, salaries, temporary regency, disconnect protection and other improvements are under discussion, not confirmed.\n\nIdeas under discussion include workshop rental, reserved wages, retained occupational experience, temporary storage during transfers and a council of major owners. These are proposals, not confirmed features."], ["Открытые решения", "Open decisions", "Названия стран, онлайн, налоги, цены, выборы, условия победы, правила собственности, неигровых персонажей и колоний требуют согласования.\n\nДо соответствующих этапов предстоит определить названия стран, лимит игроков, условия победы, налоги, правила выборов, права предприятий и колоний, а также поведение закрытого мира без игроков. Эти решения не заменяются произвольными числами.", "Nation names, player limits, taxes, prices, elections, victory, ownership, NPC and colony rules remain undecided.\n\nBefore the relevant stages, decisions are needed on nation names, player limits, victory conditions, taxes, elections, business and colony rights, and private-world behavior when empty. These decisions are not replaced by arbitrary numbers."], ["Порядок разработки", "Development order", "От экономического прототипа к поселениям, государствам, кампаниям, полной карте, политике, флоту и неигровым персонажам. Подробный порядок — в дорожной карте.\n\nСначала проверяется базовая экономика небольшой деревни, затем строительство, производство и сохранения. После этого добавляются четыре государства, частный бизнес и кампания. Полная карта, флот, колонии и развитые NPC следуют после проверки основной игры.", "From economic prototype to settlements, nations, campaigns, full map, politics, fleets and NPCs. See the roadmap for detailed sequencing.\n\nFirst the small-village economy is tested, followed by construction, production and saves. Four nations, private enterprise and a campaign come next. The full map, fleet, colonies and advanced NPCs follow validation of the core game."]],fullRoad=[["Добыча и перевозка", "Gathering and logistics", "Проверить добычу дерева и руды, подбор, вес и телегу. / Груз не исчезает и не дублируется, переполненный контейнер не принимает предмет.", "Test wood and ore gathering, pickup, weight and carts. / Cargo neither disappears nor duplicates; full containers reject items."], ["Совместная игра и интерфейс", "Multiplayer and UI", "Проверить два клиента, общие ресурсы, интерфейс и обучение. / Два игрока проходят производственную цепочку без двойных выплат.", "Test two clients, shared resources, UI and tutorials. / Two players complete the production chain without duplicate payments."], ["Строительство и хранение", "Construction and storage", "Добавить чертёж дома, доставку материалов, дверь и сундук. / Дом строится из добытого сырья, доступ защищён правами владельца.", "Add house blueprints, material deliveries, doors and chests. / Houses use gathered materials and owner permissions protect access."], ["Расширение производства", "Manufacturing expansion", "Добавить камень, лесопилку, доски, топливо и производственные очереди. / Мастерские дают полезные изделия без бесплатного производства.", "Add stone, sawmills, planks, fuel and production queues. / Workshops produce useful goods without free output."], ["Фермы и товары", "Farming and consumer goods", "Ввести посев, урожай, пищу, ткань и животноводство. / Фермер получает самостоятельный заработок, а потребление поддерживает спрос.", "Introduce planting, harvesting, food, cloth and livestock. / Farmers earn independently and consumption supports demand."], ["Постоянные сохранения", "Persistent saves", "Сохранять счета, дома, контейнеры, заказы и владельцев. / Перезапуск восстанавливает согласованное состояние без повторных выплат.", "Save accounts, houses, containers, orders and owners. / Restart restores consistent state without duplicate payments."], ["Четыре государства", "Four nations", "Создать четыре деревни, отдельные казны, склады и гражданство. / Каждая сторона самостоятельно запускает экономику без смешения имущества.", "Create four villages, separate treasuries, warehouses and citizenship. / Each side starts its economy without mixing assets."], ["Частный бизнес и наём", "Private business and employment", "Добавить магазины, мастерские, счета бизнеса и договоры найма. / Владелец, работник и покупатель могут завершить сделку с корректным учётом расходов.", "Add shops, workshops, business accounts and employment contracts. / Owners, workers and buyers complete transactions with correct expense accounting."], ["Государственная экономика", "State economy and trade", "Ввести налоги, бюджет, спрос, торговые дома и пошлины. / Государственные заказы финансируются из понятных поступлений, комиссии учитываются отдельно.", "Introduce taxes, budgets, demand, trading houses and duties. / Public contracts use traceable revenue and commissions are accounted for separately."], ["Базовые бои", "Basic combat", "Реализовать базовые игровые бои, возрождение и правила имущества. / Совместная игра не приводит к дублированию инвентаря.", "Implement basic in-game combat, respawning and property rules. / Multiplayer does not duplicate inventory."], ["Территории и кампания", "Territories and campaign", "Добавить контроль территорий, дипломатию и один формат кампании. / Кампания корректно завершается, права на объекты обновляются.", "Add territory control, diplomacy and one campaign format. / Campaigns end correctly and object permissions update."], ["Закрытая альфа", "Closed alpha", "Пригласить небольшую группу тестировщиков, проверить обучение, доходы и занятия. / Основные проблемы игрового цикла выявлены и исправляются до расширения.", "Invite a small test group and evaluate tutorials, incomes and activities. / Core gameplay problems are identified and addressed before expansion."], ["Полный остров", "Full island", "Создать полный остров, биомы, дороги и развитые месторождения. / Ресурсы доступны сопоставимо, время маршрутов и производительность проверены.", "Create the full island, biomes, roads and developed deposits. / Resource access is comparable and travel times and performance are tested."], ["Должности и роли", "Government and roles", "Добавить монарха, выборы, назначения и игровые роли. / Полномочия проверяются сервером, обязанности руководства понятны.", "Add the monarch, elections, appointments and in-game roles. / Server validates permissions and leadership duties are clear."], ["Оккупация и сопротивление", "Occupation and resistance", "Реализовать четыре пути после падения государства, включая жизнь без флага. / Граждане могут продолжать кампанию, платежи и статусы учитываются корректно.", "Implement four paths after a nation's fall, including life without a flag. / Citizens can continue the campaign and payments and statuses are tracked correctly."], ["Наземный и малый водный транспорт", "Land and small water transport", "Развить телеги, дороги, мосты, повозки, лодки и баржи. / Перевозки полезны экономике, груз и транспорт сохраняются корректно.", "Develop carts, roads, bridges, wagons, boats and barges. / Transport benefits the economy and cargo and vehicles persist correctly."], ["Верфь и флот", "Shipyards and fleet", "Добавить верфь, парусные суда, грузовые операции и ремонт. / Игроки совместно строят и используют судно без ошибок владения и сохранений.", "Add shipyards, sailing ships, cargo operations and repairs. / Players jointly build and use ships without ownership or persistence errors."], ["Колонии", "Colonies", "Создать малые острова, местных NPC, экспедиции и колониальную торговлю. / Колония поддерживает торговый маршрут, основной остров остаётся самодостаточным.", "Create small islands, local NPCs, expeditions and colonial trade. / Colonies support trade routes while the main island remains self-sufficient."], ["Неигровые персонажи и режимы", "NPCs and modes", "Добавить работы NPC, баланс населения и разные режимы кампаний. / Миры изолированы по имуществу, прогресс друзей сохраняется, нагрузка измерена.", "Add NPC jobs, population balance and different campaign modes. / Worlds have isolated assets, friends' progress persists and load is measured."], ["Бета и запуск", "Beta and release", "Проверить новичков, мобильное управление, нагрузку, вайпы и восстановление. / Несколько кампаний проходят без критических потерь имущества; доступ расширяется постепенно.", "Test onboarding, mobile controls, load, wipes and recovery. / Several campaigns finish without critical asset loss; access expands gradually."]];function drawFull(){let q=document.getElementById('wikiSearch').value.toLowerCase();document.getElementById('wikiSearch').placeholder=lang?'Search chapters…':'Поиск по разделам…';document.getElementById('wikiList').innerHTML=wikiData.map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(q)).map(({r,i})=>`<details><summary>${String(i+1).padStart(2,'0')} / ${r[lang]}</summary>${r[lang+2].split("\n\n").map(p=>`<p>${p}</p>`).join("")}</details>`).join('');document.getElementById('fullRoadList').innerHTML=fullRoad.map((r,i)=>`<article><b>${String(i+1).padStart(2,'0')}</b><h3>${r[lang]}</h3>${r[lang+2].split(" / ").map((p,j)=>`<p><strong>${j?t("Критерий готовности|Completion criterion"):t("Задачи|Tasks")}</strong><br>${p}</p>`).join("")}</article>`).join('')}document.getElementById('wikiSearch').addEventListener('input',drawFull);const oldRender=render;render=function(){oldRender();drawFull()};render();</script><footer><strong data-t="EWC — Империя, война, капитализм|EWC — Empire, War, Capitalism"></strong><p data-t="Независимый проект в разработке. Механики на сайте описывают планы, а не гарантированные возможности текущей версии.|Independent project in development. Features described here are planned, not guaranteed in the current build."></p></footer><script>render();</script><style>

ash i.spark{background:#ff9b36;box-shadow:0 0 6px 2px #ff782a99;border-radius:50%}@keyframes ash{0%{transform:translate(0,0) rotate(0deg);opacity:0}10%,80%{opacity:var(--alpha)}100%{transform:translate(var(--drift),110vh) rotate(150deg);opacity:0}}@media(max-width:650px){.ost-row{flex-wrap:wrap;gap:8px}.ost-info{flex-basis:80%}header>div:not(.hero-slide):not(.hero-controls):not(.hero-ash){padding:45px 15px 90px}}@media(prefers-reduced-motion:reduce){.hero-ash{display:none}}
